<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Celestial Lions">
<title>Celestial Lions – Fiche de jeu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="eyebrow" id="hEyebrow">Warhammer 40 000 · V11</div>
    <h1 id="hTitle">Celestial Lions</h1>
    <div class="meta" id="hMeta"></div>
  </div>
</header>

<main class="wrap" id="app">
  <p class="lede" id="loading">Chargement de ta fiche…</p>
</main>

<footer class="wrap"><p id="foot"></p></footer>

<button type="button" class="m-btn" id="mBtn" aria-haspopup="dialog" aria-controls="mOv" aria-label="Ouvrir le menu">Menu</button>
<div class="m-ov" id="mOv" role="dialog" aria-modal="true" aria-label="Menu" hidden>
  <div class="m-head">
    <button type="button" class="m-arrow" id="mPrev" aria-label="Menu précédent">‹</button>
    <div class="m-title" id="mTitle">Unités</div>
    <button type="button" class="m-arrow" id="mNext" aria-label="Menu suivant">›</button>
    <button type="button" class="m-x" id="mX" aria-label="Fermer le menu">×</button>
  </div>
  <div class="m-track" id="mTrack"></div>
  <div class="m-dots" id="mDots" aria-hidden="true"></div>
</div>

<div class="sheet-bg" id="sheetBg" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetT" hidden>
  <div class="sheet-head"><h3 id="sheetT"></h3><button type="button" class="x" id="sheetX" aria-label="Fermer">×</button></div>
  <div id="sheetP"></div>
</div>

<script src="js/bsdata.js"></script>
<script src="js/app.js"></script>
<script>
if ('serviceWorker' in navigator) { window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); }); }
</script>
</body>
</html>
